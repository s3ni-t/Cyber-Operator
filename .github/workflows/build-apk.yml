
name: Build KiberOperator APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'KiberOperatorAndroid_project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack Android project
        run: unzip -o KiberOperatorAndroid_project.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p KiberOperatorAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: KiberOperator-APK
          path: KiberOperatorAndroid/app/build/outputs/apk/debug/app-debug.apk
          
